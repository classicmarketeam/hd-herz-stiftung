    </g>
    <g fill="#b42318" font-size="18" font-weight="800" letter-spacing="1">
      <text x="436" y="462">MASHONALAND WEST</text>
    </g>
  </g>

  <circle cx="610" cy="395" r="64" fill="#d92d20" fill-opacity="0.12" stroke="#d92d20" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="610" cy="395" r="8" fill="#d92d20"/>
</svg>
