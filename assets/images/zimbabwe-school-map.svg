<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Grobe Projektkarte Simbabwe</title>
  <desc id="desc">Stilisierte Karte von Simbabwe mit Orientierung auf Mashonaland West, Chegutu und Mhondoro.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6ead7"/>
      <stop offset="0.48" stop-color="#eadbbf"/>
      <stop offset="1" stop-color="#d8e6d0"/>
    </linearGradient>
    <linearGradient id="terrain" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#a7c889"/>
      <stop offset="0.5" stop-color="#e8cf8a"/>
      <stop offset="1" stop-color="#8bb974"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#191919" flood-opacity="0.18"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#b42318" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#paper)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <g opacity="0.44" fill="none" stroke-linecap="round">
    <path d="M36 220 C240 180 330 250 466 220 C690 170 860 220 1160 156" stroke="#027a48" stroke-width="26"/>
    <path d="M16 712 C230 650 400 700 590 638 C820 562 930 612 1180 540" stroke="#027a48" stroke-width="22"/>
    <path d="M84 314 C230 340 364 320 492 388 C652 472 792 412 1056 438" stroke="#b42318" stroke-opacity="0.22" stroke-width="6" stroke-dasharray="18 18"/>
    <path d="M126 604 C284 552 438 580 602 528 C742 482 866 500 1034 456" stroke="#b42318" stroke-opacity="0.18" stroke-width="5" stroke-dasharray="14 18"/>
  </g>

  <g fill="#191919" opacity="0.52" font-family="Public Sans, Arial, sans-serif" font-size="26" font-weight="700">
    <text x="128" y="126">Sambia</text>
    <text x="892" y="170">Mosambik</text>
    <text x="110" y="770">Botswana</text>
    <text x="682" y="810">Südafrika</text>
  </g>

  <g filter="url(#softShadow)">
    <path
      d="M282 162 L356 126 L520 126 L624 156 L714 140 L802 190 L832 254 L914 300 L894 382 L956 462 L900 540 L812 574 L760 644 L638 690 L524 666 L444 700 L342 654 L302 586 L226 548 L184 464 L222 386 L202 306 L234 228 Z"
      fill="url(#terrain)"
      stroke="#ffffff"
      stroke-width="16"
      stroke-linejoin="round"
    />
    <path
      d="M282 162 L356 126 L520 126 L624 156 L714 140 L802 190 L832 254 L914 300 L894 382 L956 462 L900 540 L812 574 L760 644 L638 690 L524 666 L444 700 L342 654 L302 586 L226 548 L184 464 L222 386 L202 306 L234 228 Z"
      fill="none"
      stroke="#b42318"
      stroke-opacity="0.55"
      stroke-width="4"
      stroke-linejoin="round"
    />
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M284 192 C420 214 510 194 636 228 C740 256 798 318 902 332" stroke="#ffffff" stroke-opacity="0.56" stroke-width="5"/>
    <path d="M284 516 C438 492 540 520 642 486 C760 446 806 470 914 442" stroke="#ffffff" stroke-opacity="0.48" stroke-width="5"/>
    <path d="M300 610 C394 550 466 504 554 472 C646 438 728 404 832 330" stroke="#f9c642" stroke-opacity="0.7" stroke-width="7" stroke-dasharray="16 16"/>
    <path d="M396 208 C446 300 486 368 548 438 C620 520 668 578 736 636" stroke="#f9c642" stroke-opacity="0.44" stroke-width="6" stroke-dasharray="12 18"/>
  </g>

  <g font-family="Public Sans, Arial, sans-serif">
    <g fill="#191919" opacity="0.72" font-size="22" font-weight="700">
      <text x="692" y="260">Harare</text>
      <text x="300" y="585">Bulawayo</text>
      <text x="656" y="598">Masvingo</text>
      <text x="814" y="408">Mutare</text>
      <text x="520" y="350">Chegutu</text>
      <text x="472" y="410">Mhondoro</text>
